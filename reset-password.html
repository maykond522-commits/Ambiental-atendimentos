<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ambiental — Redefinir senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#F7FAFD,#F2F6FA);font-family:Inter,system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.card{width:min(500px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 25px 75px rgba(10,30,55,.12)}.logo{width:64px;height:64px;object-fit:contain;border:1px solid #E6EDF5;border-radius:16px;padding:5px;box-shadow:0 6px 18px rgba(7,63,135,.08)}.eyebrow{margin-top:24px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--blue2)}h1{margin:8px 0 8px;color:var(--blue);font-size:30px;letter-spacing:-.04em}p{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.55}.field{margin-bottom:18px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.input{width:100%;height:50px;border:1px solid #D3DEEA;border-radius:13px;padding:0 14px;outline:none}.input:focus{border-color:#76A6D3;box-shadow:0 0 0 4px rgba(7,63,135,.08)}button{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;cursor:pointer}.button-secondary{margin-top:10px;background:#fff;color:var(--blue);border:1px solid #CBD8E5}.status{display:none;margin:16px 0;padding:12px 14px;border-radius:12px;font-size:12px}.status.show{display:block}.ok{background:#EEFBF4;color:#087443;border:1px solid #CDECDD}.err{background:#FFF4F4;color:#C62828;border:1px solid #F3CECE}.hidden{display:none!important}
</style><link rel="stylesheet" href="/global.css">
<script src="/utils.js"></script>
</head>
<body><main class="card"><img class="logo" src="/logo.png" alt="Logo Ambiental"><div class="eyebrow">Ambiental · Avaliação Médica Pericial — LTS</div>
<h1>Redefinir senha</h1><p>Escolha uma nova senha para sua conta. Por segurança, a senha nunca será exibida nem armazenada por esta página.</p>
<form id="form"><div class="field"><label for="password">Nova senha</label><input id="password" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Digite novamente"></div><button id="btn">Atualizar senha</button><div id="status" class="status" role="status" aria-live="polite"></div></form>
<button class="button-secondary" type="button" onclick="location.replace('/login.html')">Voltar ao login</button></main>
<script>
(async()=>{const $=id=>document.getElementById(id),st=$("status"),b=$("btn");function show(type,msg){st.className=`status show ${type}`;st.textContent=msg}await AmbientalAuth.init().catch(()=>show("err","Sistema temporariamente indisponível. Tente novamente em alguns instantes."));
$("form").addEventListener("submit",async e=>{e.preventDefault();const p=$("password").value,c=$("confirm").value;if(p.length<8)return show("err","A nova senha deve possuir pelo menos 8 caracteres.");if(p!==c)return show("err","As senhas não coincidem.");b.disabled=true;b.textContent="Atualizando...";const r=await AmbientalAuth.updatePassword(p).catch(error=>({ok:false,error}));if(!r?.ok){b.disabled=false;b.textContent="Atualizar senha";return show("err","Não foi possível atualizar sua senha. Solicite um novo link de recuperação.");}show("ok","Senha atualizada com sucesso. Redirecionando para o login...");await AmbientalAuth.logout({redirect:"/login.html"});});
})();
</script></body></html>
