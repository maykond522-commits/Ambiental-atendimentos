<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambiental — Acesso restrito</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F6FA;font-family:Inter,system-ui,sans-serif;color:#162033}.card{width:min(520px,calc(100% - 40px));background:#fff;border:1px solid #DDE6EF;border-radius:22px;padding:42px;box-shadow:0 24px 70px rgba(10,30,55,.12);text-align:center}.mark{width:56px;height:56px;border-radius:16px;background:#EDF5FD;color:#073F87;display:grid;place-items:center;margin:0 auto 20px;font-size:24px;font-weight:900}h1{margin:0;color:#073F87;font-size:28px}p{color:#64748B;font-size:13px;line-height:1.6;margin:10px auto 26px;max-width:420px}.actions{display:flex;gap:10px;justify-content:center}.btn{height:44px;border-radius:11px;padding:0 16px;border:1px solid #CBD8E5;background:#fff;color:#29435F;font-weight:800;cursor:pointer}.primary{background:#073F87;border-color:#073F87;color:#fff}</style></head><body><main class="card"><div class="mark">!</div><h1>Acesso restrito</h1><p>Seu perfil não possui permissão para acessar esta área do sistema.</p><div class="actions"><button class="btn" onclick="history.length>1?history.back():location.replace('/login.html')">Voltar ao início</button><button class="btn primary" onclick="location.replace('/login.html')">Sair</button></div></main></body></html>
